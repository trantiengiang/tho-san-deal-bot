services:
  postgres:
    image: postgres:16-alpine
    container_name: thosandeal-postgres
    environment:
      POSTGRES_DB: thosandeal
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d thosandeal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thosandeal-bot
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/thosandeal
      SPRING_PROFILES_ACTIVE: ""

volumes:
  postgres_data:
    driver: local
